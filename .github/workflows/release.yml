name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest # Apple Silicon + Intel (universal binary)
            args: --target universal-apple-darwin

          - platform: ubuntu-22.04
            args: ""

          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # Universal binary on macOS requires both targets
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Linux: Tauri system dependencies + AppIndicator for tray
      - name: Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: npm install
        run: npm install

      # Generate all icon sizes from the committed icon.png source
      - name: Generate icons
        run: npx tauri icon src-tauri/icons/icon.png

      - name: Build & bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS code signing — optional, see README
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Claude Guard ${{ github.ref_name }}
          releaseBody: |
            ## Install

            | Platform | File |
            |----------|------|
            | macOS (Apple Silicon + Intel) | `.dmg` |
            | Linux | `.deb` or `.AppImage` |
            | Windows | `.msi` |

            ### macOS
            1. Download `.dmg`, open it, drag **Claude Guard** to Applications
            2. First launch: right-click → Open (Gatekeeper bypass for unsigned app)
            3. Run once in Terminal: `./install.sh` (sets up firewall permissions)

            ### Linux
            **deb:** `sudo dpkg -i claude-guard_*.deb && ./install.sh`
            **AppImage:** `chmod +x claude-guard_*.AppImage && ./install.sh && ./claude-guard_*.AppImage`

            ### Windows
            Run `.msi` as Administrator — firewall rules configured automatically on first launch.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
