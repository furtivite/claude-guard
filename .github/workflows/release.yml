name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest # Apple Silicon + Intel (universal binary)
            args: --target universal-apple-darwin

          - platform: ubuntu-22.04
            args: ""

          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # Universal binary on macOS requires both targets
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Linux: Tauri system dependencies + AppIndicator for tray
      - name: Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: npm install
        run: npm install

      # Generate all icon sizes from the committed icon.png source
      - name: Generate icons
        run: npx tauri icon src-tauri/icons/icon.png

      # Pull the section for this tag out of CHANGELOG.md for the release body
      - name: Prepare release notes
        id: notes
        shell: bash
        run: |
          section=$(awk -v tag="## ${GITHUB_REF_NAME}" 'index($0,tag)==1{f=1;next} /^## /{f=0} f' CHANGELOG.md)
          # A missing section would otherwise publish a release with no notes at all
          if [ -z "$(printf '%s' "$section" | tr -d '[:space:]')" ]; then
            echo "no CHANGELOG.md section found for ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          {
            echo "body<<RELEOF"
            printf '%s\n\n' "$section"
            printf '## Install\n\n'
            printf '| Platform | File |\n'
            printf '| --- | --- |\n'
            printf '| macOS (Apple Silicon + Intel) | `.dmg` |\n'
            printf '| Linux | `.deb` or `.AppImage` |\n'
            printf '| Windows | `.msi` |\n\n'
            printf 'See the [documentation](https://github.com/furtivite/claude-guard/blob/main/docs/installation.md) for step-by-step setup.\n'
            echo "RELEOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build & bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS code signing — optional, see README
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Claude Guard ${{ github.ref_name }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
