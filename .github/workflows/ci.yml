name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: Frontend (lint, format, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build

  rust:
    # The firewall backends are #[cfg]-gated, so a single runner only ever compiles
    # one of them. All three are built here to keep macos.rs/windows.rs from drifting
    # into a state that only breaks at release time.
    name: Rust (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: System dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      # generate_context! embeds the frontend, so dist/ must exist before clippy/test
      - name: Build frontend
        run: |
          npm ci
          npm run build

      # On Windows tauri-build embeds icons/icon.ico as a resource, and the generated
      # icon formats are gitignored — without this the crate cannot compile at all.
      - name: Generate icons
        run: npx tauri icon src-tauri/icons/icon.png

      # Formatting is platform-independent; checking it once avoids three identical runs.
      - name: rustfmt
        if: matrix.platform == 'ubuntu-22.04'
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: test
        run: cargo test --manifest-path src-tauri/Cargo.toml
